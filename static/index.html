<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Assistant</title>
<style>
  :root {
    --bg: #0d0f0e;
    --panel: #141716;
    --border: #262a28;
    --border-strong: #3a3f3c;
    --text: #e8e6e0;
    --text-muted: #8b8f8b;
    --accent: #1d9e75;
    --accent-dim: #0f6e56;
    --danger: #d85a30;
    --radius: 8px;
    --font-mono: 'SF Mono', 'Consolas', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 15px;
    font-weight: 500;
    margin: 0;
    letter-spacing: 0.02em;
  }
  header h1 span { color: var(--accent); }
  #status {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
  }
  #status.ok::before { content: "● "; color: var(--accent); }
  #status.err::before { content: "● "; color: var(--danger); }

  main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  #sidebar {
    width: 300px;
    border-right: 1px solid var(--border);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
  }
  #sidebar h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin: 0 0 4px;
    font-weight: 500;
  }
  #drop {
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius);
    padding: 20px 14px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  #drop:hover, #drop.dragover {
    border-color: var(--accent);
    background: rgba(29, 158, 117, 0.06);
  }
  #drop p { margin: 0; font-size: 13px; color: var(--text-muted); }
  #drop input { display: none; }

  #fileList { display: flex; flex-direction: column; gap: 6px; }
  .file-row {
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 8px 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .file-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-row .chunks { color: var(--accent); flex-shrink: 0; }
  .file-row.pending { color: var(--text-muted); }
  .file-row.error { color: var(--danger); }

  #chat {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg { max-width: 640px; line-height: 1.55; font-size: 14px; }
  .msg.user { align-self: flex-end; }
  .msg.assistant { align-self: flex-start; }
  .msg .role {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .msg .bubble {
    padding: 10px 14px;
    border-radius: var(--radius);
    white-space: pre-wrap;
  }
  .msg.user .bubble { background: var(--accent-dim); color: #eafff6; }
  .msg.assistant .bubble { background: var(--panel); border: 1px solid var(--border); }
  .msg.thinking .bubble { color: var(--text-muted); font-style: italic; }

  #empty {
    margin: auto;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    max-width: 320px;
  }

  #inputBar {
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    gap: 10px;
  }
  #question {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    color: var(--text);
    padding: 10px 14px;
    font-size: 14px;
    outline: none;
  }
  #question:focus { border-color: var(--accent); }
  #askBtn {
    background: var(--accent);
    color: #06251b;
    border: none;
    border-radius: var(--radius);
    padding: 0 20px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  #askBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  #askBtn:not(:disabled):hover { background: #24b385; }

  #authScreen {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #authBox {
    width: 280px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #authBox h1 { text-align: center; margin-bottom: 10px; font-size: 16px; font-weight: 500; }
  #authBox h1 span { color: var(--accent); }
  #authBox input {
    background: var(--panel);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
    outline: none;
  }
  #authBox input:focus { border-color: var(--accent); }
  #authBox button {
    border-radius: var(--radius);
    padding: 10px;
    font-size: 14px;
    cursor: pointer;
    border: none;
  }
  #loginBtn { background: var(--accent); color: #06251b; font-weight: 500; }
  #registerBtn { background: transparent; border: 1px solid var(--border-strong) !important; color: var(--text); }
  #authError { color: var(--danger); font-size: 12px; min-height: 16px; margin: 0; text-align: center; }
  #logoutBtn {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text-muted);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  #logoutBtn:hover { color: var(--text); border-color: var(--text-muted); }
</style>
</head>
<body>

<div id="authScreen">
  <div id="authBox">
    <h1>Document <span>Assistant</span></h1>
    <p id="authError"></p>
    <input type="text" id="authUsername" placeholder="Username" autocomplete="username">
    <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Log in</button>
    <button id="registerBtn">Register</button>
  </div>
</div>

<div id="app" style="display:none">
<header>
  <h1>Document <span>Assistant</span></h1>
  <div style="display:flex;align-items:center;gap:14px">
    <div id="status">checking backend…</div>
    <button id="logoutBtn">Log out</button>
  </div>
</header>

<main>
  <aside id="sidebar">
    <div>
      <h2>Upload</h2>
      <div id="drop">
        <p>Drop a PDF or image here<br>or click to browse</p>
        <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png">
      </div>
    </div>
    <div>
      <h2>Ingested files</h2>
      <div id="fileList"></div>
    </div>
  </aside>

  <section id="chat">
    <div id="messages">
      <div id="empty">Upload a document, then ask a question about it. General questions work too — the assistant decides when it needs to search.</div>
    </div>
    <div id="inputBar">
      <input type="text" id="question" placeholder="Ask something…" autocomplete="off">
      <button id="askBtn">Ask</button>
    </div>
  </section>
</main>
</div>

<script>
const API_BASE = "";  // same origin -- change if backend runs elsewhere, e.g. "http://127.0.0.1:8000"

let currentUser = localStorage.getItem("user_id");

const authScreen = document.getElementById("authScreen");
const appDiv = document.getElementById("app");
const authError = document.getElementById("authError");
const authUsername = document.getElementById("authUsername");
const authPassword = document.getElementById("authPassword");

function showApp() {
  authScreen.style.display = "none";
  appDiv.style.display = "block";
  checkHealth();
}

function showAuth() {
  appDiv.style.display = "none";
  authScreen.style.display = "flex";
}

if (currentUser) {
  showApp();
} else {
  showAuth();
}

document.getElementById("loginBtn").addEventListener("click", async () => {
  authError.textContent = "";
  const username = authUsername.value.trim();
  const password = authPassword.value;
  if (!username || !password) { authError.textContent = "Enter a username and password"; return; }

  try {
    const res = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || "Login failed");
    }
    currentUser = username;
    localStorage.setItem("user_id", username);
    showApp();
  } catch (err) {
    authError.textContent = err.message;
  }
});

document.getElementById("registerBtn").addEventListener("click", async () => {
  authError.textContent = "";
  const username = authUsername.value.trim();
  const password = authPassword.value;
  if (!username || !password) { authError.textContent = "Enter a username and password"; return; }

  try {
    const res = await fetch("/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || "Registration failed");
    }
    authError.style.color = "var(--accent)";
    authError.textContent = "Registered — now log in";
  } catch (err) {
    authError.style.color = "var(--danger)";
    authError.textContent = err.message;
  }
});

document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.removeItem("user_id");
  currentUser = null;
  messages.innerHTML = "";
  fileList.innerHTML = "";
  showAuth();
});

const statusEl = document.getElementById("status");
const fileInput = document.getElementById("fileInput");
const dropZone = document.getElementById("drop");
const fileList = document.getElementById("fileList");
const messages = document.getElementById("messages");
const emptyState = document.getElementById("empty");
const questionInput = document.getElementById("question");
const askBtn = document.getElementById("askBtn");

async function checkHealth() {
  try {
    const res = await fetch(`${API_BASE}/health?user_id=${encodeURIComponent(currentUser)}`);
    const data = await res.json();
    statusEl.textContent = `${currentUser} · ${data.chunks_stored} chunks stored`;
    statusEl.className = "ok";
  } catch (err) {
    statusEl.textContent = "backend unreachable";
    statusEl.className = "err";
  }
}

// ---------- Upload ----------

dropZone.addEventListener("click", () => fileInput.click());
dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", () => {
  if (fileInput.files.length) uploadFile(fileInput.files[0]);
  fileInput.value = "";
});

async function uploadFile(file) {
  const row = document.createElement("div");
  row.className = "file-row pending";
  row.innerHTML = `<span class="name">${file.name}</span><span class="chunks">uploading…</span>`;
  fileList.prepend(row);

  const formData = new FormData();
  formData.append("file", file);
  formData.append("user_id", currentUser);

  try {
    const res = await fetch(`${API_BASE}/upload`, { method: "POST", body: formData });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: "Upload failed" }));
      throw new Error(err.detail || "Upload failed");
    }
    const data = await res.json();
    row.className = "file-row";
    row.innerHTML = `<span class="name">${data.filename}</span><span class="chunks">${data.chunks_created} chunks</span>`;
    checkHealth();
  } catch (err) {
    row.className = "file-row error";
    row.innerHTML = `<span class="name">${file.name}</span><span class="chunks">${err.message}</span>`;
  }
}

// ---------- Chat ----------

function addMessage(role, text) {
  emptyState.remove();
  const msg = document.createElement("div");
  msg.className = `msg ${role}`;
  msg.innerHTML = `<div class="role">${role}</div><div class="bubble"></div>`;
  msg.querySelector(".bubble").textContent = text;
  messages.appendChild(msg);
  messages.scrollTop = messages.scrollHeight;
  return msg;
}

async function ask() {
  const question = questionInput.value.trim();
  if (!question) return;

  addMessage("user", question);
  questionInput.value = "";
  askBtn.disabled = true;

  const thinking = addMessage("assistant thinking", "thinking…");

  try {
    const formData = new FormData();
    formData.append("user_id", currentUser);
    formData.append("question", question);
    const res = await fetch(`${API_BASE}/query`, {
      method: "POST",
      body: formData,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: "Something went wrong" }));
      throw new Error(err.detail || "Something went wrong");
    }
    const data = await res.json();
    thinking.remove();
    addMessage("assistant", data.answer || "No answer returned.");
  } catch (err) {
    thinking.remove();
    addMessage("assistant", `Error: ${err.message}`);
  } finally {
    askBtn.disabled = false;
    questionInput.focus();
  }
}

askBtn.addEventListener("click", ask);
questionInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") ask();
});
</script>

</body>
</html>
